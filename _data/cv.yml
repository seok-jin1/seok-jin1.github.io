- title: Research Projects
  type: time_table
  contents:
    - title: "Q2515581 — Optimization of HLA gene editing for the development of allogeneic stem cell therapy"
      institution: Korea National Institute of Health (PI&#58; Prof. Dongho Geum)
      year: May 2025 - Dec 2025
      description:
        - Hypoimmunogenic iPSC generation via CRISPR-Cas9 HLA editing.
        - Directed differentiation into immune-evasive cardiomyocytes and T cells.
        - In vivo engraftment validation using humanized murine models.
    - title: "Q2431261 — Safety evaluation of viral vector-based gene therapy with respect to non-specific genome insertion"
      institution: Ministry of Food and Drug Safety (PI&#58; Prof. Taehoon Chun)
      year: Feb 2025 - Dec 2025
      description:
        - Vector engineering (Lentiviral/AAV) and in vivo administration.
        - WGS/NGS library construction for genomic integration profiling.
        - Statistical analysis of insertion site distribution and toxicity correlations.
    - title: "R2131151 — Development of cellular immune evaluation technology for viral vector-based genetic vaccines"
      institution: Ministry of Food and Drug Safety (PI&#58; Prof. Taehoon Chun)
      year: Feb 2022 - Dec 2025
      description:
        - Candidate selection for Adenovirus/Vaccinia-based platforms.
        - Assay development for humoral and cellular immunity assessment.
        - Safety profiling including cytotoxicity and organ-specific toxicity.
    - title: "R2222761 — Regulation of immune cell differentiation by chromatin 3D structural changes"
      institution: National Research Foundation of Korea (PI&#58; Prof. Taehoon Chun)
      year: Sep 2022 - Feb 2025
      description:
        - Chromatin 3D structural analysis mediated by LDB1 looper.
        - Multi-omics integration (RNA/ATAC/ChIP-seq) for enhancer–promoter mapping.
        - In vivo validation using LDB1-floxed mouse models.
    - title: "R2212861 — Development of universal SARS-CoV-2 and sarbecovirus vaccine candidate using NDV vector platform"
      institution: Korea Health Industry Development Institute (PI&#58; Prof. Kisoon Kim)
      year: Apr 2022 - Dec 2023
      description:
        - Structural epitope modeling using AlphaFold for cross-protection.
        - Immunogenicity evaluation in viral challenge animal models.
        - Immune profiling via ELISA and flow cytometry.
    - title: "Q2029461 — Production and efficacy evaluation of novel recombinant immunotherapeutics"
      institution: Immunological Designing Lab Co., Ltd. (PI&#58; Prof. Taehoon Chun)
      year: Jan 2021 - Jun 2023
      description:
        - Recombinant protein production and purification.
        - Affinity characterization via SPR and ELISA.
    - title: "R1923081 — Mechanistic study of macrophage polarization regulated by chromatin remodeling factor Phc2"
      institution: National Research Foundation of Korea (PI&#58; Prof. Taehoon Chun)
      year: Sep 2019 - Feb 2022
      description:
        - Transcriptomic profiling of macrophage polarization states.
        - Differential expression analysis (DEG) and pathway enrichment.
        - Regulatory network identification of Phc2-mediated activation.
    - title: "Q2015891 — Screening of immune-enhancing probiotics using immunodeficient mouse models"
      institution: CJ CheilJedang & BLOSSOM PARK (PI&#58; Prof. Taehoon Chun)
      year: Jun 2020 - Feb 2021
      description:
        - In vivo screening and cytokine profiling (Flow cytometry/qPCR).
        - Statistical evaluation of immune enhancement using R.
    - title: "R1715822 — Development of novel immune cell therapy targeting multiple myeloma"
      institution: National Research Foundation of Korea (PI&#58; Prof. Taehoon Chun)
      year: Mar 2018 - Jun 2022
      description:
        - CAR construct engineering and optimization via molecular cloning.
        - Binder selection for high affinity and specificity.
        - Kinetics analysis (Kd) using surface plasmon resonance (SPR).
    - title: "PJ013271012018 — Development of genetic markers associated to the resistance to PMWS"
      institution: Rural Development Administration (PI&#58; Prof. Taehoon Chun)
      year: Mar 2018 - Dec 2020
      description:
        - Comparative genomics for resistance marker identification.
        - Variant detection pipeline using BLAST and Biopython.
    - title: "R1727591 — Development of DNA markers to enhance resistance against chronic wasting diseases"
      institution: Rural Development Administration (PI&#58; Prof. Taehoon Chun)
      year: Jan 2018 - Dec 2020
      description:
        - SNP genotyping and sequence analysis for resistance markers.
        - Pipeline development using Python/Biopython for variant detection.
    - title: "Q1815701 — Determination of dosing period and amount of probiotics for alleviating allergic rhinitis"
      institution: CJ CheilJedang (PI&#58; Prof. Taehoon Chun)
      year: Jun 2018 - Nov 2018
      description:
        - Th1/Th2 cytokine profiling via ELISA and gene expression.
        - Dosing optimization modeling for immune regulation.
    - title: "Q1613841 — Selection and in vivo efficacy verification of probiotics with enhanced IgA secretion"
      institution: CJ CheilJedang (PI&#58; Prof. Taehoon Chun)
      year: Jul 2016 - Apr 2017
      description:
        - Mucosal IgA quantification in murine models.
        - Immune gene validation using qPCR.

