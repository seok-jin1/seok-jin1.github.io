<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1.5 1.5L10.5 6L1.5 10.5V1.5Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 18px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #4B5563; }
      .section { font: 700 18px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #111827; letter-spacing: 0.04em; text-transform: uppercase; }
      .panelTitle { font: 700 24px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #0F172A; }
      .body { font: 500 19px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #334155; }
      .small { font: 500 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #64748B; }
      .mono { font: 500 16px 'IBM Plex Mono', 'SFMono-Regular', monospace; fill: #0F172A; }
      .stageTitle { font: 700 22px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #0F172A; }
      .stageText { font: 500 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
      .badge { font: 700 13px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; fill: #0F172A; }
      .num { font: 700 18px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .note { font: 500 15px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#FFFFFF"/>

  <line x1="88" y1="122" x2="1512" y2="122" stroke="#CBD5E1" stroke-width="2"/>
  <text x="96" y="74" class="title">RFantibody-gui system schematic</text>
  <text x="96" y="108" class="subtitle">Browser-based orchestration of the RFantibody de novo antibody design workflow</text>

  <rect x="96" y="166" width="1416" height="180" rx="20" fill="#FAFBFC" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="124" y="202" class="section">Web Application Layer</text>

  <rect x="124" y="224" width="368" height="94" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="148" y="256" class="panelTitle">User inputs</text>
  <text x="148" y="286" class="body">Target antigen PDB, framework PDB, hotspots, loop schema, design counts</text>

  <rect x="528" y="224" width="292" height="94" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="552" y="256" class="panelTitle">Browser UI</text>
  <text x="552" y="286" class="body">Upload form, progress view, log stream, artifact list, NGL viewer</text>

  <rect x="856" y="224" width="332" height="94" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="880" y="256" class="panelTitle">FastAPI orchestrator</text>
  <text x="880" y="286" class="body">Validates environment, stores run state, launches CLI stages, exposes downloads</text>

  <rect x="1224" y="224" width="260" height="94" rx="16" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="1248" y="256" class="panelTitle">Runtime requirements</text>
  <text x="1248" y="286" class="body">uv environment, CUDA GPU, model weights in <tspan class="mono">weights/</tspan></text>

  <path d="M492 271H520" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M820 271H848" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1188 271H1216" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="96" y="382" width="1416" height="418" rx="20" fill="#FAFBFC" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="124" y="418" class="section">Pipeline Execution</text>

  <rect x="132" y="454" width="255" height="280" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="156" y="490" class="panelTitle">Per-run workspace</text>
  <text x="156" y="526" class="mono">gui_runs/&lt;job_id&gt;/</text>
  <text x="156" y="564" class="body">inputs/</text>
  <text x="156" y="594" class="body">designs/</text>
  <text x="156" y="624" class="body">logs/</text>
  <text x="156" y="654" class="body">meta.json</text>
  <line x1="156" y1="676" x2="362" y2="676" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="156" y="712" class="small">The GUI copies uploaded PDB files, keeps stage outputs separated, and tracks artifacts for download and preview.</text>

  <rect x="442" y="454" width="228" height="120" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <circle cx="480" cy="490" r="18" fill="#0072B2"/>
  <text x="473" y="497" class="num">1</text>
  <text x="510" y="492" class="stageTitle">RFdiffusion</text>
  <text x="474" y="528" class="stageText">Antibody-tuned backbone generation conditioned on antigen, framework, and hotspot geometry</text>
  <text x="474" y="558" class="mono">designs/01_rfdiffusion/</text>

  <rect x="722" y="454" width="228" height="120" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <circle cx="760" cy="490" r="18" fill="#E69F00"/>
  <text x="753" y="497" class="num">2</text>
  <text x="790" y="492" class="stageTitle">ProteinMPNN</text>
  <text x="754" y="528" class="stageText">Sequence design over generated backbones with loop-focused control for antibody regions</text>
  <text x="754" y="558" class="mono">designs/02_proteinmpnn/</text>

  <rect x="1002" y="454" width="228" height="120" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <circle cx="1040" cy="490" r="18" fill="#009E73"/>
  <text x="1033" y="497" class="num">3</text>
  <text x="1070" y="492" class="stageTitle">RF2 validation</text>
  <text x="1034" y="528" class="stageText">RoseTTAFold2-based structure prediction and quality estimation for designed sequences</text>
  <text x="1034" y="558" class="mono">designs/03_rf2_validation/</text>

  <rect x="1282" y="454" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <circle cx="1320" cy="490" r="18" fill="#CC79A7"/>
  <text x="1313" y="497" class="num">4</text>
  <text x="1350" y="492" class="stageTitle">Ranking</text>
  <text x="1314" y="528" class="stageText">Best pLDDT-based top candidate selection with metrics export</text>
  <text x="1314" y="558" class="mono">TOP_10_CANDIDATES/</text>

  <path d="M387 514H424" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M670 514H704" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M950 514H984" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1230 514H1264" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="442" y="618" width="1030" height="116" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="466" y="652" class="panelTitle">Artifacts exposed to the user</text>
  <text x="466" y="686" class="body">Per-stage logs, PDB files, JSON metrics, ranked candidate structures, and direct browser preview/download endpoints</text>
  <text x="466" y="716" class="mono">/api/jobs/{job_id}/logs   /api/jobs/{job_id}/artifacts   /api/jobs/{job_id}/download/{artifact_path}</text>

  <rect x="96" y="836" width="1416" height="84" rx="18" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1.5"/>
  <text x="124" y="872" class="badge">Interpretation</text>
  <text x="124" y="902" class="note">RFantibody-gui does not replace the core RFantibody models; it packages the original CLI pipeline into a reproducible local web workflow with job state management, artifact organization, and result inspection.</text>
</svg>
