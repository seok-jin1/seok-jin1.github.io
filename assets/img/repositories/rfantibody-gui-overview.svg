<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="70" x2="1520" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F3EA"/>
      <stop offset="1" stop-color="#E9F1F3"/>
    </linearGradient>
    <linearGradient id="hero" x1="120" y1="110" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <linearGradient id="stage1" x1="880" y1="340" x2="1330" y2="465" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="stage2" x1="880" y1="490" x2="1330" y2="615" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="stage3" x1="880" y1="640" x2="1330" y2="765" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="stage4" x1="880" y1="790" x2="1330" y2="895" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11V1Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 42px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #F8FAFC; }
      .subtitle { font: 500 20px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #D9F7F3; }
      .section { font: 700 24px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #0F172A; }
      .cardTitle { font: 700 24px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #FFFFFF; }
      .cardText { font: 500 16px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #E5EEF8; }
      .label { font: 700 15px 'IBM Plex Sans', 'Segoe UI', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; fill: #0F766E; }
      .body { font: 500 17px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #334155; }
      .small { font: 500 15px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #475569; }
      .mono { font: 500 16px 'IBM Plex Mono', 'SFMono-Regular', monospace; fill: #0F172A; }
      .stageNum { font: 700 18px 'IBM Plex Mono', monospace; fill: #E2E8F0; }
      .pillText { font: 700 15px 'IBM Plex Sans', sans-serif; fill: #155E75; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1360" cy="120" r="150" fill="#F59E0B" fill-opacity="0.08"/>
  <circle cx="180" cy="840" r="180" fill="#0F766E" fill-opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="80" y="70" width="1440" height="170" rx="30" fill="url(#hero)"/>
  </g>
  <text x="120" y="140" class="title">RFantibody-gui Overview</text>
  <text x="120" y="180" class="subtitle">Local FastAPI interface for de novo antibody design with sequential RFantibody stages</text>

  <rect x="1180" y="108" width="285" height="82" rx="20" fill="#F8FAFC" fill-opacity="0.14" stroke="#CFFAFE" stroke-opacity="0.25"/>
  <text x="1210" y="142" class="stageNum">runtime prerequisites</text>
  <text x="1210" y="171" class="cardText">uv environment  •  weights/  •  NVIDIA GPU</text>

  <text x="100" y="290" class="section">What the repository does</text>

  <g filter="url(#shadow)">
    <rect x="100" y="320" width="410" height="250" rx="28" fill="#FFFCF6" stroke="#E2E8F0"/>
  </g>
  <text x="130" y="360" class="label">Inputs</text>
  <text x="130" y="405" class="body">Target antigen PDB</text>
  <text x="130" y="438" class="body">Framework PDB</text>
  <text x="130" y="471" class="body">Hotspots and loop design settings</text>
  <text x="130" y="504" class="body">Optional model weight overrides</text>
  <text x="130" y="548" class="mono">target.pdb   framework.pdb</text>

  <g>
    <rect x="355" y="376" width="120" height="72" rx="16" fill="#E0F2FE" stroke="#7DD3FC"/>
    <path d="M387 391H443V434H387Z" fill="#BAE6FD"/>
    <path d="M397 407H433" stroke="#0369A1" stroke-width="4" stroke-linecap="round"/>
    <path d="M397 417H427" stroke="#0369A1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="355" y="460" width="120" height="72" rx="16" fill="#DCFCE7" stroke="#86EFAC"/>
    <path d="M387 475H443V518H387Z" fill="#BBF7D0"/>
    <path d="M397 491H433" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
    <path d="M397 501H427" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="320" width="250" height="580" rx="28" fill="#FFFDF8" stroke="#E2E8F0"/>
  </g>
  <text x="590" y="360" class="label">GUI Orchestrator</text>
  <text x="590" y="403" class="section">FastAPI app.py</text>
  <text x="590" y="445" class="body">Job manager validates weights,</text>
  <text x="590" y="473" class="body">copies uploads, launches CLI stages,</text>
  <text x="590" y="501" class="body">streams logs, and tracks artifacts.</text>

  <rect x="590" y="540" width="190" height="64" rx="18" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="620" y="579" class="pillText">static/index.html</text>
  <text x="590" y="640" class="small">Browser features</text>
  <text x="590" y="674" class="body">Upload form</text>
  <text x="590" y="706" class="body">Stage progress</text>
  <text x="590" y="738" class="body">Artifact list + downloads</text>
  <text x="590" y="770" class="body">NGL PDB viewer</text>
  <text x="590" y="820" class="mono">gui_runs/&lt;job_id&gt;/</text>
  <text x="590" y="850" class="small">designs/  logs/  inputs/  meta.json</text>

  <g filter="url(#shadow)">
    <rect x="860" y="320" width="470" height="125" rx="28" fill="url(#stage1)"/>
  </g>
  <text x="890" y="356" class="stageNum">01</text>
  <text x="890" y="392" class="cardTitle">RFdiffusion</text>
  <text x="890" y="426" class="cardText">Antibody-tuned backbone generation from target antigen, framework, hotspots, and loop constraints</text>
  <text x="1120" y="392" class="cardText">designs/01_rfdiffusion/</text>

  <g filter="url(#shadow)">
    <rect x="860" y="470" width="470" height="125" rx="28" fill="url(#stage2)"/>
  </g>
  <text x="890" y="506" class="stageNum">02</text>
  <text x="890" y="542" class="cardTitle">ProteinMPNN</text>
  <text x="890" y="576" class="cardText">Sequence design on generated antibody backbones with loop-focused design control</text>
  <text x="1112" y="542" class="cardText">designs/02_proteinmpnn/</text>

  <g filter="url(#shadow)">
    <rect x="860" y="620" width="470" height="125" rx="28" fill="url(#stage3)"/>
  </g>
  <text x="890" y="656" class="stageNum">03</text>
  <text x="890" y="692" class="cardTitle">RF2 validation</text>
  <text x="890" y="726" class="cardText">RoseTTAFold2 prediction and filtering to estimate structure quality for each designed sequence</text>
  <text x="1085" y="692" class="cardText">designs/03_rf2_validation/</text>

  <g filter="url(#shadow)">
    <rect x="860" y="770" width="470" height="110" rx="28" fill="url(#stage4)"/>
  </g>
  <text x="890" y="806" class="stageNum">04</text>
  <text x="890" y="842" class="cardTitle">Top candidate selection</text>
  <text x="890" y="870" class="cardText">Rank RF2 outputs by best pLDDT and export TOP_10_CANDIDATES with metrics JSON and reports</text>

  <g filter="url(#shadow)">
    <rect x="1360" y="320" width="160" height="560" rx="28" fill="#FFFCF6" stroke="#E2E8F0"/>
  </g>
  <text x="1388" y="360" class="label">Outputs</text>
  <text x="1388" y="408" class="body">Live logs</text>
  <text x="1388" y="448" class="body">Stage counts</text>
  <text x="1388" y="488" class="body">PDB preview</text>
  <text x="1388" y="528" class="body">Artifact download</text>
  <text x="1388" y="584" class="small">candidate_001.pdb</text>
  <text x="1388" y="614" class="small">candidate_001_metrics.json</text>
  <text x="1388" y="644" class="small">ranking_report.json</text>
  <text x="1388" y="704" class="body">Goal</text>
  <text x="1388" y="740" class="small">Make the RFantibody CLI</text>
  <text x="1388" y="768" class="small">pipeline runnable from a local</text>
  <text x="1388" y="796" class="small">web browser without manual shell</text>
  <text x="1388" y="824" class="small">command orchestration.</text>

  <path d="M510 445H540C550 445 550 445 560 445" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M810 390H840C850 390 850 390 860 390" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1095 445V456" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1095 595V606" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1095 745V756" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1330 825H1342C1350 825 1350 825 1360 825" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="100" y="620" width="410" height="280" rx="28" fill="#FFFCF6" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="130" y="660" class="label">Why this GUI matters</text>
  <text x="130" y="706" class="body">Repository adds a browser layer on top of the original</text>
  <text x="130" y="736" class="body">RFantibody command line tools, so users can:</text>
  <text x="145" y="784" class="body">• upload PDBs instead of wiring shell commands</text>
  <text x="145" y="818" class="body">• monitor one job state across all three stages</text>
  <text x="145" y="852" class="body">• inspect final candidate PDBs directly in the UI</text>
  <text x="145" y="886" class="body">• download ranked outputs per run directory</text>
</svg>
